<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkyCast{% endblock %}</title>

    <!-- Our own styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Leaflet powers the live radar map. Loaded from a CDN so we
         don't have to ship a mapping library ourselves. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar">
        <span class="brand">SkyCast</span>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('history_page') }}">History</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Hidden by default; main.js shows this to surface error
         messages (bad city name, API down, etc.) without an
         intrusive browser alert() popup. -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
